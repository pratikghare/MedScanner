type User {
    userId: ID!
    emailId: String
    name: String!
    initials: String
    password: String!
    phone: Int
    image: String
}

extend type Query {
    startServer: Boolean!
    getUser(userId: String!, password: String!): User
    loggedInUser(token: String!): User
    getAllUsers: [User!]!
    isUserPresent(userId: String!, field: String): Boolean!
}

extend type Mutation {
    addUser(name: String!, emailId: String!, password: String!, userId: String!, initials: String!): MutationResponse
}