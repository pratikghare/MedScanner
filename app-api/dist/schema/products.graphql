type Product {
    productId: ID!
    categoryId: Int!
    name: String!
    price: Float!
    availability: Boolean!
    slug: String
    manufacturer: String!
    images: [String!]
}

extend type Query {
    getProductById(productId: ID!): Product
    getAllProducts: [Product!]!
    getProductsByName(name: String!): [Product!]!
}